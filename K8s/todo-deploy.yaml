apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
      - name: todo-app
        image: saivicky321/java-todo-mysql:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://mysql:3306/tododb
        - name: SPRING_DATASOURCE_USERNAME
          value: todo
        - name: SPRING_DATASOURCE_PASSWORD
          value: todo